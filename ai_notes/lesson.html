<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./theme.js"></script>
<title>Lesson — QElight AI Field Expertise</title>
<style>
  :root { color-scheme: light; --ink:#16231e; --muted:#596b60; --green:#166848; --line:#d9e3dd; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f5f9f5; color:var(--ink); font:16px/1.65 Inter,system-ui,sans-serif; }
  a { color:var(--green); }
  a:focus-visible { outline:3px solid #9ed7b2; outline-offset:3px; }
  header { background:#103e2d; color:white; padding:16px max(20px,calc((100vw - 940px)/2)); }
  header a { color:white; font-weight:700; text-decoration:none; }
  main { max-width:940px; margin:24px auto 60px; padding:0 20px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:clamp(20px,4vw,48px); }
  .nav { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; margin:16px 0; }
  .nav a { display:inline-block; background:#e7f4eb; border-radius:8px; padding:8px 12px; text-decoration:none; }
  .nav a:hover { background:#d4ebdb; }
  .status { color:var(--muted); }
  article h1 { font-size:clamp(1.6rem,4vw,2.3rem); line-height:1.25; }
  article h2 { border-top:1px solid var(--line); padding-top:20px; margin-top:40px; }
  article h3, article h4 { margin-top:28px; }
  article :is(p,li) { overflow-wrap:anywhere; }
  article blockquote { border-left:4px solid #7ab593; margin:20px 0; padding:2px 18px; background:#f5faf6; }
  article pre { overflow:auto; background:#15271e; color:#f0f8f1; border-radius:10px; padding:16px; line-height:1.45; }
  article :not(pre) > code { background:#eef3ee; padding:2px 5px; border-radius:4px; }
  article table { display:block; overflow:auto; border-collapse:collapse; max-width:100%; }
  article th, article td { padding:8px 11px; border:1px solid #cbdad0; text-align:left; min-width:110px; }
  article th { background:#e7f4eb; }
  article img { max-width:100%; height:auto; }
  @media(max-width:600px) { main { padding:0 10px; } .panel { padding:20px 16px; } }
</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body class="lesson-page">
<header><a href="./">← QElight AI Field Expertise · Master TOC</a><button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button></header>
<main>
  <nav class="nav" id="previous-nav" aria-label="Previous lesson"></nav>
  <div class="panel"><p id="status" class="status" role="status">Loading lesson…</p><article id="lesson"></article><section id="resources" aria-label="Practice resources"></section></div>
  <nav class="nav" id="next-nav" aria-label="Next lesson"></nav>
</main>
<script type="module">
import { marked } from "./vendor/marked.esm.js";
import { loadCatalog } from "./catalog.js";

const status = document.getElementById("status");
const id = new URLSearchParams(location.search).get("id");
let noteBase = location.href;
const noteHref = href => {
  if (href.startsWith("#")) return href;
  try { return new URL(href, noteBase).href; }
  catch { return href; }
};
const safeUrl = href => {
  try {
    const url = new URL(href, location.href);
    return ["https:", "http:", "mailto:"].includes(url.protocol) ||
      (url.origin === location.origin && ["https:", "http:"].includes(url.protocol));
  } catch { return false; }
};
const escapeHTML = value => String(value).replace(/[&<>"']/g, char =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char]);

marked.use({ renderer: {
  html({text}) { return escapeHTML(text); },
  link({href, title, tokens}) {
    const label = this.parser.parseInline(tokens);
    if (!safeUrl(href)) return label;
    return `<a href="${escapeHTML(noteHref(href))}"${title ? ` title="${escapeHTML(title)}"` : ""}>${label}</a>`;
  },
  image({href, text}) {
    if (!safeUrl(href)) return escapeHTML(text);
    return `<img src="${escapeHTML(noteHref(href))}" alt="${escapeHTML(text)}">`;
  }
}});

try {
  const lessons = await loadCatalog();
  if (!id || !Object.hasOwn(lessons, id)) throw new Error("Lesson unavailable. Choose an available lesson from the master TOC.");
  const lesson = lessons[id];
  const note = await fetch(lesson.note);
  if (!note.ok) throw new Error("The lesson file could not be loaded.");
  noteBase = new URL(lesson.note, location.href).href;
  document.title = `${id} — ${lesson.title} | QElight`;
  document.getElementById("lesson").innerHTML = marked.parse(await note.text());
  status.remove();

  const ids = Object.keys(lessons), position = ids.indexOf(id);
  for (const [container, adjacent, prefix] of [
    ["previous-nav", ids[position - 1], "← Previous: "],
    ["next-nav", ids[position + 1], "Next: "]
  ]) {
    if (!adjacent) continue;
    const link = document.createElement("a");
    link.href = "lesson.html?id=" + encodeURIComponent(adjacent);
    link.textContent = prefix + adjacent + " · " + lessons[adjacent].title;
    document.getElementById(container).append(link);
  }

  if (lesson.resources?.length) {
    const section = document.getElementById("resources");
    const heading = document.createElement("h2");
    heading.textContent = "Practice resources";
    section.append(heading);
    const list = document.createElement("ul");
    for (const resource of lesson.resources) {
      if (!safeUrl(resource.url)) continue;
      const item = document.createElement("li"), link = document.createElement("a");
      link.href = resource.url;
      link.textContent = resource.label;
      item.append(link); list.append(item);
    }
    section.append(list);
  }
} catch (error) {
  status.textContent = error.message;
}
</script>
</body>
</html>
