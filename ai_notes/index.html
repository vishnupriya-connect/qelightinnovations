<script type="module">
import { loadCatalog } from "./catalog.js";
(() => {
  const markdown = document.getElementById("toc-source").textContent.trim();
  const toc = document.getElementById("toc");
  const search = document.getElementById("search");
  const status = document.getElementById("status");
  const root = { level: 0, title: "", bullets: [], children: [] };
  const stack = [root];
  const atomicCount = (markdown.match(/^\s*-\s+/gm) || []).length;
  const sectionCount = (markdown.match(/^##\s+/gm) || []).length;

  for (const line of markdown.split(/\r?\n/)) {
    const heading = line.match(/^(#{1,6})\s+(.+)$/);
    if (heading) {
      const level = heading[1].length;
      const node = { level, title: heading[2].trim(), bullets: [], children: [] };
      while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
      stack[stack.length - 1].children.push(node);
      stack.push(node);
      continue;
    }
    const bullet = line.match(/^(\s*)-\s+(.+)$/);
    if (bullet && stack.length > 1) {
      stack[stack.length - 1].bullets.push({
        indent: Math.min(4, Math.floor(bullet[1].replace(/\t/g, "  ").length / 2)),
        text: bullet[2].trim()
      });
    }
  }

  const textFor = node => [
    node.title,
    ...node.bullets.map(item => item.text),
    ...node.children.map(textFor)
  ].join(" ").toLowerCase();

  function render(node, topLevel = false) {
    if (node.level === 1) return null;
    const details = document.createElement("details");
    details.className = "depth-" + node.level;
    details.dataset.search = textFor(node);
    const id = node.title.match(/^(QAI\.\d+(?:\.\d+)+)\s+[—–-]/);
    if (id) details.dataset.lessonId = id[1];
    if (topLevel && node.title.startsWith("QAI.00")) details.open = true;

    const summary = document.createElement("summary");
    summary.textContent = node.title;
    details.append(summary);

    const content = document.createElement("div");
    content.className = "content";

    if (node.bullets.length) {
      const list = document.createElement("ul");
      for (const item of node.bullets) {
        const li = document.createElement("li");
        li.className = "indent-" + item.indent;
        li.textContent = item.text;
        list.append(li);
      }
      content.append(list);
    }

    for (const child of node.children) {
      const childElement = render(child);
      if (childElement) content.append(childElement);
    }

    details.append(content);
    return details;
  }

  const displayNodes = root.children.flatMap(node =>
    node.level === 1 ? node.children : [node]
  );

  for (const node of displayNodes) {
    const element = render(node, node.level === 2);
    if (element) toc.append(element);
  }

  function filterTOC() {
    const query = search.value.trim().toLowerCase();
    let visibleTop = 0;
    document.querySelectorAll("#toc > details").forEach(top => {
      const match = !query || top.dataset.search.includes(query);
      top.hidden = !match;
      if (match) visibleTop += 1;
      if (query && match) top.open = true;

      top.querySelectorAll("details").forEach(detail => {
        const childMatch = !query || detail.dataset.search.includes(query);
        detail.hidden = !childMatch;
        if (query && childMatch) detail.open = true;
      });
    });
    status.textContent = query
      ? visibleTop + " matching main unit" + (visibleTop === 1 ? "" : "s")
      : sectionCount + " main units · " + atomicCount.toLocaleString() + " atomic items";
  }

  document.getElementById("expand").addEventListener("click", () => {
    document.querySelectorAll("#toc details:not([hidden])").forEach(item => item.open = true);
  });
  document.getElementById("collapse").addEventListener("click", () => {
    document.querySelectorAll("#toc details").forEach(item => item.open = false);
    const first = document.querySelector("#toc > details");
    if (first) first.open = true;
  });
  search.addEventListener("input", filterTOC);
  filterTOC();

  loadCatalog()
    .then(lessons => {
      for (const detail of toc.querySelectorAll("details[data-lesson-id]")) {
        const id = detail.dataset.lessonId;
        if (!Object.hasOwn(lessons, id)) continue;
        const link = document.createElement("a");
        link.className = "lesson-link";
        link.href = "lesson.html?id=" + encodeURIComponent(id);
        link.textContent = "Read lesson →";
        detail.querySelector(":scope > .content").prepend(link);
      }
      const total = Object.keys(lessons).length;
      const count = document.createElement("span");
      count.textContent = total + " lessons available";
      count.setAttribute("aria-label", total + " lessons available");
      document.querySelector(".toolbar").append(count);
    })
    .catch(error => {
      console.error(error);
      const notice = document.createElement("span");
      notice.textContent = "Lessons unavailable; please try again later.";
      notice.setAttribute("role", "alert");
      document.querySelector(".toolbar").append(notice);
    });
})();
</script>
